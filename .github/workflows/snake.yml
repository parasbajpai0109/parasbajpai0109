name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: parasbajpai0109
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#a855f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a855f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}